services:
  workshop-app:
    image: ramadanwaly/workshop-app:latest
    container_name: workshop-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    networks:
      - accounting-app_default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  accounting-app_default:
    external: true
