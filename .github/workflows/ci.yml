name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io
      - name: Build Docker image
        run: docker build -t workshop-app:ci-${{ github.run_number }}-${GITHUB_SHA::7} .
      - name: Show built image
        run: docker image ls workshop-app
