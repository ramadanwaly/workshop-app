services:
  workshop-app:
    image: workshop-app:prod
    container_name: workshop-app
    restart: unless-stopped
    networks:
      - proxy_network
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy_network:
    external: true